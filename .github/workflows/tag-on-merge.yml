name: tag-on-merge
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'frontend/desktop/**'
      - 'frontend/photo-helper/**'
      - 'frontend/map-corridors/**'

jobs:
  bump-and-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Needed by the dispatch step below — without it `gh workflow run`
      # 403s and the release silently never builds.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: lbehounek/tag-on-merge-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-prefix: desktop-v

      # The tag alone does NOT start the build, which is why desktop-v2.30.0 was
      # tagged and then nothing happened until it was dispatched by hand.
      # GitHub deliberately refuses to start a workflow from an event raised
      # with the default GITHUB_TOKEN (recursion guard), so the `push: tags:`
      # trigger in build-desktop.yml never fires for a tag this job pushed.
      #
      # `workflow_dispatch` and `repository_dispatch` are the two documented
      # EXCEPTIONS to that rule, so dispatching explicitly works with the same
      # token and needs no PAT. Dispatching at the tag ref matters: the build
      # reads its version from `github.ref_name`, and the release job is gated
      # on `startsWith(github.ref, 'refs/tags/desktop-v')` — so a ref-less
      # dispatch would build an artifact and publish no release.
      - name: Trigger the desktop build for the new tag
        if: steps.tag.outputs.new-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new-tag }}
        run: |
          set -euo pipefail
          echo "Dispatching Build Desktop App at $NEW_TAG"
          gh workflow run "Build Desktop App" --ref "$NEW_TAG"

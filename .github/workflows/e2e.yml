name: E2E (Electron)

# Runs the Playwright end-to-end suite against the real Electron build. Electron
# needs a desktop session, which the windows-latest runner provides. The sub-apps
# are built first (served via the app:// protocol).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A force-push while E2E is mid-run should cancel the superseded run rather
# than stack a second 25-minute windows job on top of it.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs (force-push churn), but NEVER a run on main: this
  # workflow also fires on `push: main`, and two merges inside 25 minutes would
  # otherwise cancel the first merge commit's verification, letting a commit land
  # with no completed E2E.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build sub-apps (served via app:// in the Electron build)
        working-directory: frontend/desktop
        run: pnpm run build:apps

      - name: Run Playwright E2E
        working-directory: frontend/desktop
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/desktop/playwright-report
          retention-days: 7
          if-no-files-found: ignore

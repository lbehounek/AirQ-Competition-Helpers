name: Build Desktop App

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''

  # Trigger on tags
  push:
    tags:
      - 'desktop-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    # Recent runs take ~5 min; 30 leaves headroom for a cold cache while still
    # capping a hang far below GitHub's 360-minute default.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Photo Helper
        working-directory: frontend
        env:
          VITE_DESKTOP_BUILD: 'true'
        run: pnpm --filter @airq/photo-helper build

      - name: Build Map Corridors
        working-directory: frontend
        env:
          VITE_DESKTOP_BUILD: 'true'
        run: pnpm --filter @airq/map-corridors build

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            # Manual input takes priority
            $version = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_name }}".StartsWith("desktop-v")) {
            # Extract from desktop tag
            $version = "${{ github.ref_name }}" -replace '^desktop-v', ''
          } else {
            # Get latest tag from repo
            git fetch --tags --quiet
            try {
              $latestTag = git tag --sort=-v:refname | Select-Object -First 1
              if ($latestTag) {
                $version = $latestTag -replace '^v', '' -replace '^desktop-v', ''
              } else {
                $version = "1.0.0"
              }
            } catch {
              $version = "1.0.0"
            }
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Using version: $version"

      - name: Update package.json version
        working-directory: frontend/desktop
        shell: pwsh
        run: |
          $json = Get-Content package.json | ConvertFrom-Json
          $json.version = "${{ steps.get_version.outputs.VERSION }}"
          $json | ConvertTo-Json -Depth 100 | Set-Content package.json
          Write-Host "Set version to: ${{ steps.get_version.outputs.VERSION }}"

      - name: Build Windows executables
        working-directory: frontend/desktop
        run: pnpm exec electron-builder --win --publish never

      # Nothing else fails the build if a target silently drops out of
      # `build.win.target` (e.g. the pwsh version rewrite above mangling the
      # JSON), and the release would then ship one file instead of two.
      - name: Verify both artifacts exist
        working-directory: frontend/desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe -ErrorAction SilentlyContinue
          $portable = Get-ChildItem dist/*-portable.exe -ErrorAction SilentlyContinue
          if (-not $setup -or -not $portable) {
            Write-Error 'expected both photo-helper-v*-setup.exe and photo-helper-v*-portable.exe in dist/'
            exit 1
          }
          Get-ChildItem dist/*.exe | Format-Table Name, Length

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: photo-helper-v${{ steps.get_version.outputs.VERSION }}
          path: frontend/desktop/dist/*.exe
          if-no-files-found: error

  # Create GitHub Release when triggered by tag
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF_NAME#desktop-v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Desktop App v${{ steps.tag_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
          body: |
            ## AirQ Competition Helpers - Desktop Edition v${{ steps.tag_version.outputs.VERSION }}

            Windows desktop application bundling Photo Editor and Photo Placement.

            **Which file?**
            - `photo-helper-v${{ steps.tag_version.outputs.VERSION }}-setup.exe` — **recommended.** Installs for the current user only (no administrator rights), lets you choose the folder, adds Desktop and Start-menu shortcuts, and does not unpack itself on every launch.
            - `photo-helper-v${{ steps.tag_version.outputs.VERSION }}-portable.exe` — run-from-anywhere build for USB sticks or machines where installing is not allowed. It unpacks its whole contents into a temporary folder on every launch, so it starts more slowly.

            Both builds keep their data in the same per-user folder, so your competitions carry over when you switch. The app is unsigned by design — on first run click *More info → Run anyway* in SmartScreen.

            ### System Requirements
            - Windows 10/11 (64-bit)

            ### Changes
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

  - photo-helper
  - map-corridors
  - landing
  - competitions
  - desktop

# `onlyBuiltDependencies` allowlist — packages with `postinstall`/`install`
# lifecycle scripts that pnpm v10+ blocks by default for supply-chain safety.
# Each entry below has been individually reviewed; everything else stays
# blocked. Migrated from `frontend/package.json` (pnpm.onlyBuiltDependencies)
# at PR #61 — pnpm v10 deprecated that location and v11 stops honouring it.
onlyBuiltDependencies:
  - canvas
  - core-js
  - electron
  - electron-winstaller
  - esbuild

# Security overrides. These pin transitive resolutions to versions that
# carry CVE patches. The conditional `pkg@<version` syntax means the
# override only fires when a transitive resolution would otherwise yield
# the vulnerable range — so it's a no-op when upstream has already moved
# on, and we don't have to remember to remove entries. Carets are
# intentional here (unlike direct-dep deps where exact pinning is the
# default per global CLAUDE.md): an override is itself a security pin, so
# `^10.1.1` means "the lowest patched 10.x or newer", which is the
# tightest range that still allows future patch-level updates without
# requiring a manual revisit.
#
# Migrated from `frontend/package.json` (pnpm.overrides) at PR #61 — same
# pnpm v10 deprecation reason as above.
overrides:
  # NOTE on the exact-vs-conditional choice below: two entries here were once
  # written as EXACT pins (`'@xmldom/xmldom': '0.8.13'`, `postcss: '8.5.10'`).
  # Both later became the thing holding a vulnerable version in place — an
  # exact override silently blocks the upstream patch, so a direct-dependency
  # bump has no effect and the advisory never clears. Every entry is therefore
  # conditional (`pkg@<patched`) with a caret target: it fires only while the
  # resolution would be vulnerable, and becomes a no-op once upstream moves on.
  # Do not convert these back to exact pins.
  flatted: '^3.4.2'
  lodash: '^4.18.1'
  picomatch: '^4.0.4'
  'yaml@<1.10.3': '^1.10.3'
  'protocol-buffers-schema@<3.6.1': '3.6.1'
  # --- refreshed 2026-09-12: each entry below had been superseded by a newer
  # --- advisory, and the previous pin was itself the vulnerable version.

  # GHSA-jrc7-96c5-q579 and friends. xmldom was pinned at an exact 0.8.13,
  # which is below the 0.8.15 patch line; the exact pin prevented the fix.
  '@xmldom/xmldom@<0.8.15': '^0.8.15'
  # PostCSS arbitrary file read. Was pinned exact at 8.5.10 (vulnerable);
  # patched in 8.5.12, current advisory line is 8.5.23.
  'postcss@<8.5.23': '^8.5.23'
  # node-tar: decompression/parse DoS via unlimited input, and a negative
  # tar-entry size infinite loop. Previous `^7.5.11` still resolved a
  # vulnerable 7.5.13 on one path.
  'tar@<7.5.19': '^7.5.19'
  # brace-expansion ReDoS / unbounded expansion, three separate major lines.
  # Each previous pin was overtaken by a later advisory.
  'brace-expansion@<1.1.21': '^1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '^2.1.7'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  # tmp: type-confusion bypass of _assertPath allows path traversal. The
  # earlier 0.2.6 pin is exactly the version the new advisory names.
  'tmp@<0.2.7': '^0.2.7'
  # js-yaml: YAML merge-key chains force quadratic CPU, plus an empty
  # merge-source variant. Build-time only (electron-builder reads its own
  # config), but patch-level and free.
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  # form-data: CRLF injection via unescaped field names. Build-time only.
  'form-data@>=4.0.0 <4.0.6': '^4.0.6'
  # undici: TLS certificate validation bypass, WebSocket DoS, and cross-origin
  # request routing. Reaches us only through jsdom, i.e. the test environment.
  # Separate 6.x and 8.x patches are listed in the November refresh below.
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
  # browserslist: ReDoS. Dev-time only (bundler target resolution).
  'browserslist@<4.28.7': '^4.28.7'
  # electron-builder was bumped to 26.15.3, but its optional peer
  # electron-builder-squirrel-windows stayed at 26.8.1 and dragged a second,
  # older copy of app-builder-lib (<26.15.0, uncontrolled search path) and
  # builder-util-runtime (<9.7.0, cross-origin redirect leak) into the tree.
  # The desktop workspace also declares this peer explicitly so pnpm resolves
  # the builder family consistently.
  'electron-builder-squirrel-windows@<26.15.3': '^26.15.3'
  # electron-updater (reached transitively through electron-builder; desktop
  # declares no runtime dependencies of its own) still pinned an old
  # builder-util-runtime and app-builder-lib on its own path. Both are
  # patch-level within their major.
  'builder-util-runtime@<9.7.0': '^9.7.0'
  'app-builder-lib@<26.15.0': '^26.15.0'

  # 2026-11 security refresh; retain API-compatible major lines where possible.
  'uuid@<11.1.1': '^11.1.1'
  'esbuild@<0.28.1': '^0.28.1'
  '@babel/core@<7.29.6': '^7.29.6'
  '@opentelemetry/core@<2.8.0': '^2.8.0'
  '@humanfs/node@<0.16.8': '^0.16.8'
  'qs@<6.16.1': '^6.16.1'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'ip-address@<10.7.4': '^10.7.4'
  '@grpc/grpc-js@<1.14.5': '^1.14.5'
  'source-map-js@<1.2.2': '^1.2.2'
  'proxy-addr@<2.0.8': '^2.0.8'
  '@modelcontextprotocol/sdk@<1.32.0': '^1.32.0'
  'hono@<4.13.16': '^4.13.16'
  '@hono/node-server@<2.1.6': '^2.1.6'
  'zod@<4.6.6': '^4.6.6'
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'
  'undici@>=6.0.0 <6.29.1': '^6.29.1'
  'undici@>=8.0.0 <8.12.2': '^8.12.2'
  'glob@>=9.0.0 <14.0.2': '^14.0.2'
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'
